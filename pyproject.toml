[project]
name = "cora"
version = "0.1.0"
description = "CORA - Customer-Oriented Resolution Agent (Factored AI & Data Hackathon 2026)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.106",
    "pandas==2.2.3",
    "pandera==0.20.4",
    "pydantic-settings==2.15.0",
    "pyjwt==2.10.1",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
analysis = [
    "duckdb==1.1.3",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "pandera==0.20.4",
    "pyarrow==17.0.0",
]
nlu = [
    "fasttext-wheel==0.9.2",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "sentence-transformers==3.0.1",
    "tenacity==9.0.0",
    "torch==2.4.1",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"
# `.agents/` is the task-harness scratch area (plans, feature specs), not project source.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The data-dictionary column lists are one long string per table on purpose: splitting
# them hurts readability and diffability. This is EDA/profiling code, not shipped logic.
"analysis/profile_tables.py" = ["E501"]
# The keyword baseline is one alternation regex per intent per language. A single regex cannot
# be wrapped without hurting readability, and `ruff format` already lays the tuples out; E501 on
# the lone regex-string lines is noise here. Same rationale as the data-dictionary lists above.
"src/cora/nlu/baselines.py" = ["E501"]
# The injection screen is one alternation regex per rule (es+pt+en). Same rationale as the
# keyword baseline: a rule's regex cannot wrap without hurting readability.
"src/cora/nlu/injection.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "cora"
version = "0.1.0"
description = "CORA - Customer-Oriented Resolution Agent (Factored AI & Data Hackathon 2026)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.43.106",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
analysis = [
    "duckdb==1.1.3",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "pandera==0.20.4",
    "pyarrow==17.0.0",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The data-dictionary column lists are one long string per table on purpose: splitting
# them hurts readability and diffability. This is EDA/profiling code, not shipped logic.
"analysis/profile_tables.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
